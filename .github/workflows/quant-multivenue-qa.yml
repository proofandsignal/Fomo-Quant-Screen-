name: Quant Public Synthetic + Research QA
on:
  pull_request:
    paths:
      - 'quant-market-sources.js'
      - 'quant-profit-calc.js'
      - 'premium-demo.html'
      - 'premium-demo-engine.js'
      - 'premium-demo-ui.js'
      - 'fomo-trade-ui.js'
      - 'tests/fomo-trade-planner.mjs'
      - 'tests/premium-demo.mjs'
      - 'quant-market-lab.html'
      - 'quant-market-lab.js'
      - 'derivatives-shadow.js'
      - 'tests/quant-multivenue.mjs'
      - 'tests/quant-release-invariants.mjs'
      - 'tests/quant-protected-preview.mjs'
      - 'preview/quant-protected/server.mjs'
      - 'index.html'
      - 'docs/QUANT_BOOST_RELEASE_BUNDLE_001.md'
      - 'tests/quant-exchange-live-smoke.mjs'
      - 'tests/quant-browser-qa.py'
      - '.github/workflows/quant-multivenue-qa.yml'
  push:
    branches: [main]
    paths:
      - 'premium-demo.html'
      - 'premium-demo-engine.js'
      - 'premium-demo-ui.js'
      - 'fomo-trade-ui.js'
      - 'tests/fomo-trade-planner.mjs'
      - 'tests/premium-demo.mjs'
      - 'quant-market-lab.html'
      - 'quant-market-lab.js'
      - 'quant-profit-calc.js'
      - 'tests/quant-browser-qa.py'
      - 'tests/quant-multivenue.mjs'
      - 'tests/quant-release-invariants.mjs'
      - 'tests/quant-protected-preview.mjs'
      - 'preview/quant-protected/server.mjs'
      - '.github/workflows/quant-multivenue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and deterministic test fixtures
        run: |
          node --check quant-market-sources.js
          node --check quant-profit-calc.js
          node --check quant-market-lab.js
          node --check premium-demo-engine.js
          node --check premium-demo-ui.js
          node --check fomo-trade-ui.js
          node --test tests/fomo-trade-planner.mjs
          node tests/derivatives-isolation.mjs
          node --test tests/quant-multivenue.mjs tests/quant-release-invariants.mjs tests/quant-protected-preview.mjs tests/premium-demo.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium Playwright controller (preinstalled Chrome)
        run: pip install playwright
      - name: Chromium public synthetic UI and no-exchange-egress QA
        run: |
          google-chrome --version
          python tests/quant-browser-qa.py
      - name: Save synthetic QA evidence from runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fomo-six-venue-coverage
          path: |
            /tmp/fomo-quant-six-venues/
            /tmp/fomo-quant-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
