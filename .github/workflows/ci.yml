name: FOMO Quant Screen CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/planner-smoke.mjs
      - run: node tests/planner-paper-ready.mjs
      - run: node tests/low-base-accel.mjs
      - run: node tests/derivatives-shadow.mjs
      - run: node tests/derivatives-isolation.mjs
